# Example Custom Device
# Add your custom devices here or directly to catalogue.yaml

version: 1.0
devices:
  my-custom-device:
    id: my-custom-device
    name: "My Custom Device"
    manufacturer: "My Company"
    type: sbc
    category: experimental
    description: "Example custom SBC for testing"
    capabilities:
      - reflashable
      - bootable
      - storage
      - compute
      - headless
      - ethernet
      - wifi
    firmware_version: "1.0.0"
    last_updated: "2025-01-19"
    tags:
      - custom
      - arm64
      - test
    specifications:
      cpu: "Custom Quad-core ARMv8 @ 2.0GHz"
      ram: "4GB DDR4"
      storage: "eMMC 32GB"
      gpu: "Mali-G78"
      network: "Gigabit Ethernet, WiFi 5"
    reflash_methods:
      - method: dd
        tool: "dd"
        command: "dd if=image.img of=/dev/mmcblk0 bs=4M status=progress"
      - method: custom-tool
        tool: "MyFlashTool"
        notes: "Custom flashing utility"
    boot_modes:
      - sd_card
      - usb_mass_storage
    connections:
      - type: hdmi
        count: 1
      - type: ethernet
        count: 1
      - type: usb_a
        count: 2
      - type: gpio
        count: 40
    known_good_os:
      - "Ubuntu 22.04 ARM64"
      - "Custom Linux"
    recovery:
      serial_console: true
      reset_button: true
