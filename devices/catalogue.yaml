# ============================================
# Custom Device Template
# ============================================
# To add a custom device, create a YAML file in the custom/ directory
# or add it directly to this file under the 'devices' key.
# 
# Required fields:
#   id: Unique identifier (lowercase, hyphen-separated)
#   name: Human-readable name
#   manufacturer: Manufacturer name
#   type: One of: sbc, ai_computer, laptop, desktop, server, other
#   category: One of: fit_for_purpose, experimental, legacy, unsupported
#   description: Brief description
#   capabilities: List of capabilities from the classifications above
#
# Example minimal entry:
# custom-device:
#   id: custom-device
#   name: "My Custom Device"
#   manufacturer: "My Company"
#   type: sbc
#   category: experimental
#   description: "My custom SBC"
#   capabilities:
#     - reflashable
#     - storage
